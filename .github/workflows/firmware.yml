name: Validate ESP32 CAN logger

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Verify passive CAN and all-ID logger contracts
        run: python tests/can/test_passive_contract.py

      - name: Verify offline CAN analysis fixtures
        run: python tests/can/test_offline_analyzer.py

      - name: Verify dashboard logic
        run: node dashboard/can.test.cjs

      - name: Verify dashboard DOM integration
        run: node dashboard/can.dom.test.cjs

      - name: Compile CSV encoder test
        run: g++ -std=c++17 -Isrc/can tests/can/test_csv_encoder.cpp -o test_csv_encoder

      - name: Run CSV encoder test
        run: ./test_csv_encoder

      - name: Prepare CI Wi-Fi configuration
        run: cp include/wifi_config.example.h include/wifi_config.h

      - name: Build ESP32 firmware
        run: pio run -e esp32dev
